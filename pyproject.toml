[project]
name = "fusion-archiver"
version = "1.1.0"
description = "Bulk-export the latest version of every Autodesk Fusion document, sorting your designs from imported models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["FusionArchiver"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["UP006", "UP007", "UP035", "UP045", "S101", "S110", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"FusionArchiver/FusionArchiver.py" = ["E402", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["archiver_core"]
known-third-party = ["adsk"]
